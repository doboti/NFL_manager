services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridiron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gridiron
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridiron"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/doboti/nfl-manager-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg2://gridiron:${POSTGRES_PASSWORD}@db:5432/gridiron
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/doboti/nfl-manager-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
