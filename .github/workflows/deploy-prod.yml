name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (git commit SHA, or 'latest' for the newest main build)"
        required: true
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Debug secret presence
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "Environment used by this job: production"
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH TAILSCALE_AUTHKEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name: EMPTY"
            else
              echo "$name: set (length=${#value})"
            fi
          done

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_TAG=${{ github.event.inputs.image_tag }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
