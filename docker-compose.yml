services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridiron
      POSTGRES_PASSWORD: gridiron
      POSTGRES_DB: gridiron
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridiron"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Dev-only: --reload watches the bind-mounted source below for live
    # editing. Production runs the Dockerfile's plain CMD (no bind mount,
    # nothing to watch, and --reload's file-watcher there was pure risk --
    # any spurious restart kills the in-process APScheduler background
    # thread that resolves bot trade offers/runs the daily cycle).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://gridiron:gridiron@db:5432/gridiron
      JWT_SECRET_KEY: dev-secret-change-me
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
